# Runs ON THE VPS — this is the dev AND production stack. There is no
# separate local-emulation setup (see docs/adr/0010). "docker compose up -d"
# is the entire deploy.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build: .
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "app.workers.worker_settings.WorkerSettings"]
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
